<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a6"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3b52"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#1c2535">Catálogo colaborativo de variantes genéticas humanas</text>
  <text x="500" y="72" text-anchor="middle" font-size="14.5" fill="#6b7689">25 Variantes · 5 Genes · 5 Integrantes · Repostiorio GitHub</text>
  <line x1="300" y1="88" x2="700" y2="88" stroke="#e2e6ec" stroke-width="1.5"/>

  <!-- STEP 1: source -->
  <text x="60" y="126" font-size="11.5" font-weight="700" fill="#9aa3b2" letter-spacing="1.4">1 · FUENTE</text>
  <rect x="60" y="138" width="150" height="112" rx="9" fill="#eef3fb" stroke="#c2d2ea" stroke-width="1.5"/>
  <text x="135" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#2b4a7d">ClinVar</text>
  <text x="135" y="198" text-anchor="middle" font-size="12" fill="#53698c">NCBI</text>
  <text x="135" y="216" text-anchor="middle" font-size="12" fill="#53698c">base pública de</text>
  <text x="135" y="232" text-anchor="middle" font-size="12" fill="#53698c">variantes clínicas</text>

  <path d="M 218 194 L 272 194" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 2: genes + authorship -->
  <text x="290" y="126" font-size="11.5" font-weight="700" fill="#9aa3b2" letter-spacing="1.4">2 · UN GEN Y UNA RAMA POR INTEGRANTE · 5 VARIANTES CADA UNO</text>

