    <text x="355" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="#2f3b52">BRCA1</text>
    <text x="355" y="185" text-anchor="middle" font-size="10.5" fill="#78839a">reparación del ADN</text>
    <line x1="306" y1="198" x2="404" y2="198" stroke="#e2e6ec" stroke-width="1"/>
    <text x="355" y="216" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2f3b52">Iván Monge</text>
