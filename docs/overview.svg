  <text x="60" y="438" font-size="11.5" font-weight="700" fill="#9aa3b2" letter-spacing="1.4">4 · FLUJO DE COLABORACIÓN</text>
  <path d="M 455 398 L 455 450" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 807 398 L 807 450" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

